name: Build bridge

# Builds the Go bridge against a chosen whatsmeow version and publishes it as a fork release (assets: whatsapp-bridge-linux-amd64, SHA256SUMS.txt) that the salt state pulls via releases/latest/download.
# Re-run when the bridge logs 405 "client outdated": WhatsApp raised its client-version floor and the pinned whatsmeow is too old; `latest` pulls a current one.

on:
  workflow_dispatch:
    inputs:
      whatsmeow_version:
        description: whatsmeow module version (latest, a tag, or a pseudo-version)
        required: false
        default: latest

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Bump whatsmeow and build
        id: build
        working-directory: whatsapp-bridge
        run: |
          go get go.mau.fi/whatsmeow@${{ inputs.whatsmeow_version }}
          go mod tidy
          go build -o whatsapp-bridge-linux-amd64 .
          sha256sum whatsapp-bridge-linux-amd64 > SHA256SUMS.txt
          echo "whatsmeow=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge-build-${{ github.run_number }}
          name: bridge build ${{ github.run_number }} — whatsmeow ${{ steps.build.outputs.whatsmeow }}
          body: Built from `${{ github.ref_name }}` against whatsmeow `${{ steps.build.outputs.whatsmeow }}`.
          make_latest: "true"
          files: |
            whatsapp-bridge/whatsapp-bridge-linux-amd64
            whatsapp-bridge/SHA256SUMS.txt
